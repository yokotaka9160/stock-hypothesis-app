services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app
      - backend-data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  # SQLite（仮説・株価データなど）を置く。コンテナを作り直しても消えない
  backend-data:
